spring:
  application:
    name: portfolio-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/default_db
    username: admin
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

member:
  api:
    base-url: http://localhost:8081/api/members

logging:
  level:
    com.portfolio.manager: DEBUG
